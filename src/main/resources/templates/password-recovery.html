<!DOCTYPE html>
<html lang="en" xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
</head>
<body class="notranslate" style="margin:0; padding:0; background-color:#f4f4f7; font-family:Arial,sans-serif;">

<!-- El contenedor principal usa max-width fluido, permitiendo crecimiento vertical -->
<table role="presentation" cellspacing="0" cellpadding="0" border="0" align="center" width="100%" style="max-width:550px; background-color:#ffffff; margin:30px auto; border-radius:8px; overflow:hidden; box-shadow:0 4px 10px rgba(0,0,0,0.05);">

    <!-- Encabezado (La estructura td domina el fondo) -->
    <tr>
        <td style="background-color:#1a252f; padding:25px; text-align:center;">
            <img th:src="${logoUrl}" alt="Company Logo" width="120" style="display:block; margin:0 auto; border:0; max-width:100%; height:auto;">
        </td>
    </tr>

    <!-- Cuerpo del mensaje -->
    <tr>
        <td style="padding:40px 30px; background-color:#ffffff;">
            <!-- Los estilos de texto están aislados de la estructura -->
            <h2 style="margin:0 0 20px 0; color:#111111; font-size:22px; font-weight:bold; line-height:1.3;">Password Recovery</h2>

            <p style="margin:0 0 16px 0; color:#333333; font-size:16px; line-height:1.5;">
                Hi <span th:text="${userName}" style="font-weight:bold;">User</span>,
            </p>

            <p style="margin:0 0 30px 0; color:#333333; font-size:16px; line-height:1.5;">
                We have received a request to reset your password. Click the button below to set up a new one.
            </p>

            <!-- BOTÓN RESISTENTE: El diseño lo maneja el TD, no el enlace A -->
            <table role="presentation" cellspacing="0" cellpadding="0" border="0" align="center" style="margin:0 auto 30px auto; width:auto;">
                <tr>
                    <td align="center" valign="middle" style="background-color:#3498db; border-radius:4px; padding:12px 30px;">
                        <a th:href="${resetLink}" target="_blank" style="color:#ffffff; display:inline-block; font-size:15px; font-weight:bold; text-decoration:none; font-family:Arial,sans-serif; line-height:100%;">
                            Reset Password
                        </a>
                    </td>
                </tr>
            </table>

            <!-- Alerta (Estructura en TD protege el borde y el fondo blando) -->
            <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="margin-bottom:20px;">
                <tr>
                    <td style="background-color:#fdf2f2; border-left:4px solid #e74c3c; padding:12px; border-radius:0 4px 4px 0;">
                        <p style="margin:0; font-size:14px; color:#e74c3c; font-weight:bold; line-height:1.4;">
                            This link expires in 15 minutes. Hurry up!
                        </p>
                    </td>
                </tr>
            </table>

            <p style="margin:0; font-size:14px; color:#777777; line-height:1.4;">
                If you didn't request this, you can safely ignore this email.
            </p>
        </td>
    </tr>
</table>
</body>
</html>
