#DATABASE CONNECTION (LOCAL DEVELOPMENT ONLY)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
#ENABLE AUTO-START
spring.sql.init.mode=never
#DISABLE AUTOMATIC SCHEMA GENERATION
spring.jpa.hibernate.ddl-auto=validate
#SHOW SQL QUERIES IN CONSOLE
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true=always

#JWT SECRET KEY (LOCAL DEVELOPMENT ONLY)
app.jwt.secret=${JWT_SECRET}
#TOKENS EXPIRE IN 24HS
app.jwt.expiration-ms=86400000

#RESEND
app.resend.api-key=${RESEND_API_KEY}
app.resend.from-email=${RESEND_FROM_EMAIL}

app.frontend.url=${FRONTEND_URL}

#TITLE IMAGE
app.title.url=${TITLE_IMAGE_URL}

spring.jpa.open-in-view=false
